displayName="${mod_name}"
credits="Derived from Dragon Mine Z (https://github.com/DragonMineZ/dragonminez), Copyright (c) DragonMine Z 2025, GPL-3.0. Bleach is a fan-made, unofficial, non-commercial work."
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
